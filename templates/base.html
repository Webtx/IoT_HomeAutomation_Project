<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CTRLHOUSE{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-home">
                <a href="/" style="color: #fff; text-decoration: none; font-size: 1.5rem; font-weight: bold;">CTRLHOUSE</a>
            </div>
            <button class="nav-toggle" aria-label="Toggle menu" onclick="toggleMenu()">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="/about" class="nav-link">About</a></li>
                <li><a href="/line-chart" class="nav-link">Environmental Data</a></li>
                <li><a href="/device-control" class="nav-link">Device Control</a></li>
                <li><a href="/security" class="nav-link">Security</a></li>
            </ul>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
    function toggleMenu() {
        const menu = document.getElementById('navMenu');
        menu.classList.toggle('show');
    }
    </script>
    {% block scripts %}
    {% endblock %}
</body>
</html>
